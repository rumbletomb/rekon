name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag semántico, por ejemplo v1.3.0
        required: true
        type: string
      target:
        description: Rama o commit que se publicará
        required: true
        default: main
        type: string
      title:
        description: Título del release
        required: true
        type: string
      prerelease:
        description: Publicar como prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'El release %s ya existe; no se modifica.\n' "$TAG"
            exit 0
          fi

          args=(
            release create "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$TARGET"
            --title "$TITLE"
            --generate-notes
          )
          if [[ $PRERELEASE == true ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"
